name: Production Rollout Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-raven-production-rollout
  cancel-in-progress: false

jobs:
  production-preflight:
    name: Production migration and release preflight
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.CMS_PRODUCTION_DATABASE_URL }}
      NR_PRODUCTION_WORKSPACE_ROOT: ${{ github.workspace }}
      NR_WEBSHOP_GIT_SHA: 3ff8e9f9475f69cb7e7dbff34d01a94d378fe610
      NR_LICENSE_SERVER_ADDON_GIT_SHA: c477d8cea06a3ae9cb638c6f341a3ab2ac8777e0
      NR_MASTER_GIT_SHA: 76612151f53e57256304501be37cf0e663d8ad26
      NR_DEPLOYMENT_WORKER_GIT_SHA: 28f1dce98ce995280e212fa386620e08ca0196b9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Webshop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/webshop
          ref: ${{ env.NR_WEBSHOP_GIT_SHA }}
          ssh-key: ${{ secrets.NR_WEBSHOP_DEPLOY_KEY }}
          path: .private/webshop
          persist-credentials: false

      - name: Checkout pinned License Server add-on source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/license-server-addon
          ref: ${{ env.NR_LICENSE_SERVER_ADDON_GIT_SHA }}
          ssh-key: ${{ secrets.NR_LICENSE_SERVER_ADDON_DEPLOY_KEY }}
          path: .private/license-server-addon
          persist-credentials: false

      - name: Checkout pinned central Master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/license-server
          ref: ${{ env.NR_MASTER_GIT_SHA }}
          ssh-key: ${{ secrets.NR_MASTER_DEPLOY_KEY }}
          path: .private/license-server
          persist-credentials: false

      - name: Checkout pinned deployment worker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/addon-deployment-worker
          ref: ${{ env.NR_DEPLOYMENT_WORKER_GIT_SHA }}
          ssh-key: ${{ secrets.NR_DEPLOYMENT_WORKER_DEPLOY_KEY }}
          path: .private/addon-deployment-worker
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Verify protected production preconditions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "CMS_PRODUCTION_DATABASE_URL is not configured"; exit 1; }
          test -n "${NR_PRODUCTION_WORKSPACE_ROOT:-}" || { echo "NR_PRODUCTION_WORKSPACE_ROOT is not configured"; exit 1; }
          test -d "$NR_PRODUCTION_WORKSPACE_ROOT/.private"
          test "$(git -C "$NR_PRODUCTION_WORKSPACE_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$NR_PRODUCTION_WORKSPACE_ROOT/.private/webshop" rev-parse HEAD)" = "$NR_WEBSHOP_GIT_SHA"
          test "$(git -C "$NR_PRODUCTION_WORKSPACE_ROOT/.private/license-server-addon" rev-parse HEAD)" = "$NR_LICENSE_SERVER_ADDON_GIT_SHA"
          test "$(git -C "$NR_PRODUCTION_WORKSPACE_ROOT/.private/license-server" rev-parse HEAD)" = "$NR_MASTER_GIT_SHA"
          test "$(git -C "$NR_PRODUCTION_WORKSPACE_ROOT/.private/addon-deployment-worker" rev-parse HEAD)" = "$NR_DEPLOYMENT_WORKER_GIT_SHA"

      - name: Run migration checksum and production dry-run only
        shell: bash
        run: |
          set -euo pipefail
          cd "$NR_PRODUCTION_WORKSPACE_ROOT"
          npm ci --ignore-scripts
          npm run deploy:verify
          npm run db:migrate:production:dry-run

      - name: Stop before irreversible promotion
        shell: bash
        run: |
          echo "Production promotion is intentionally not automated."
          echo "An approved operator must attach staging evidence, immutable backups, and provider deployment authority before migration apply or deploy."
