name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-copy:
    name: Frozen public verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_DB: nr_cms_ci_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d nr_cms_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nr_cms_ci_test
      DRIZZLE_AUTO_MIGRATE: "false"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nr_cms_ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate every GitHub Actions workflow
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Frozen install
        run: npm ci --ignore-scripts

      - name: Generate fail-closed public add-on registry
        env:
          NR_ADDON_SOURCE_MODE: empty
        run: npm run addons:registry

      - name: Test database migration
        run: npm run db:migrate:test

      - name: Static and unit verification
        run: |
          npm run lint -- --quiet
          npm run typecheck
          npm run test

      - name: Public-copy install, test, build, and NFT boundary gate
        run: npm run acceptance:public-copy

      - name: Supply-chain and runtime dependency audit
        run: |
          npm run supply-chain:audit:public
          npm audit --omit=dev --audit-level=low
