name: Production Add-on Package Release

on:
  workflow_dispatch:
    inputs:
      addon:
        description: Exact allowlisted add-on identity
        required: true
        type: choice
        options:
          - license-server
          - webshop
      mode:
        description: Verify exact Linux bytes, publish a new version, or reconcile an interrupted publication
        required: true
        default: publish
        type: choice
        options:
          - verify
          - publish
          - reconcile
      approval:
        description: Exact package/version publication approval phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-addon-${{ inputs.addon }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'radomirradojevic/nr_cms'
    name: Publish signed immutable package
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 60
    env:
      PACKAGE_NAME: ${{ inputs.addon == 'license-server' && '@radomirradojevic/license-server-addon' || '@radomirradojevic/webshop' }}
      PACKAGE_SLUG: ${{ inputs.addon == 'license-server' && 'license-server-addon' || 'webshop' }}
      PACKAGE_PATH: ${{ inputs.addon == 'license-server' && 'license-server-addon' || 'webshop' }}
      TARGET_REPOSITORY: ${{ inputs.addon == 'license-server' && 'radomirradojevic/license-server-addon' || 'radomirradojevic/webshop' }}
      PACKAGE_VERSION: ${{ inputs.addon == 'license-server' && '0.2.1' || '0.6.36' }}
      SOURCE_SHA: ${{ inputs.addon == 'license-server' && '19a5735208f0089b5485837932da532023d12963' || '3ff8e9f9475f69cb7e7dbff34d01a94d378fe610' }}
      CMS_SHA: ${{ inputs.addon == 'license-server' && '72a0f106256d1b7616780ef034d226270a0344f8' || 'bee6ca64f247723cf2472def6408787b4d4f3dd5' }}
      EXPECTED_ARTIFACT_SHA256: ${{ inputs.addon == 'license-server' && 'b8285f03876baf4a4e4cd4345111aeac9ab6b95ebedd00aa908cd40ddeacb072' || '188489a38388c35ba86727a3ac2c7801cee25d3b57b29373c6469c572ffaafe7' }}
      EXPECTED_MIGRATION_SHA256: ${{ inputs.addon == 'license-server' && 'e5b1e32557033ba532db00301725b9712c8a56cf190088d002912ace51503b44' || '1f0122fc02752f9deba6e96bba53ac5a7884e249b2921a9c4e1c8ad7d32db7ef' }}
      TARBALL_FILE: ${{ inputs.addon == 'license-server' && 'radomirradojevic-license-server-addon-0.2.1.tgz' || 'radomirradojevic-webshop-0.6.36.tgz' }}
      RELEASE_TITLE: ${{ inputs.addon == 'license-server' && 'License Server v0.2.1' || 'Webshop v0.6.36' }}
      NR_ADDON_RELEASE_SIGNING_KID: ${{ vars.NR_ADDON_RELEASE_SIGNING_KID }}
      NR_ADDON_RELEASE_PRODUCTION_KIDS: ${{ vars.NR_ADDON_RELEASE_SIGNING_KID }}

    steps:
      - name: Validate explicit release authorization
        shell: bash
        env:
          PACKAGE_RELEASE_TOKEN: ${{ secrets.NR_PACKAGE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test '${{ inputs.approval }}' = "PUBLISH $PACKAGE_NAME@$PACKAGE_VERSION"
          test '${{ inputs.mode }}' = 'verify' || test '${{ inputs.mode }}' = 'publish' || test '${{ inputs.mode }}' = 'reconcile'
          test "$GITHUB_REF_NAME" = 'master'
          test -n "${NR_ADDON_RELEASE_SIGNING_KID:-}"
          test -n "${PACKAGE_RELEASE_TOKEN:-}"
          [[ "$NR_ADDON_RELEASE_SIGNING_KID" =~ ^production-release:[0-9a-f]{16}$ ]]

      - name: Checkout pinned CMS host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/nr_cms
          ref: ${{ env.CMS_SHA }}
          path: release-root
          persist-credentials: false

      - name: Checkout pinned add-on source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          path: release-root/.private/${{ env.PACKAGE_PATH }}
          token: ${{ secrets.NR_PACKAGE_RELEASE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://npm.pkg.github.com
          scope: '@radomirradojevic'
          cache: npm
          cache-dependency-path: |
            release-root/package-lock.json
            release-root/.private/${{ env.PACKAGE_PATH }}/package-lock.json

      - name: Materialize protected production release authority
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.NR_ADDON_RELEASE_SIGNING_KEY_B64 }}
          PUBLIC_KEYS_B64: ${{ secrets.NR_ADDON_RELEASE_PUBLIC_KEYS_B64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY_B64:-}"
          test -n "${PUBLIC_KEYS_B64:-}"
          umask 077
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/addon-release-signing-key.pem"
          printf '%s' "$PUBLIC_KEYS_B64" | base64 --decode > "$RUNNER_TEMP/addon-release-public-keys.json"
          test -s "$RUNNER_TEMP/addon-release-signing-key.pem"
          test -s "$RUNNER_TEMP/addon-release-public-keys.json"
          echo "NR_ADDON_RELEASE_SIGNING_KEY_FILE=$RUNNER_TEMP/addon-release-signing-key.pem" >> "$GITHUB_ENV"
          echo "NR_ADDON_RELEASE_PUBLIC_KEYS_FILE=$RUNNER_TEMP/addon-release-public-keys.json" >> "$GITHUB_ENV"

      - name: Build and verify the exact production package
        shell: bash
        working-directory: release-root
        env:
          NR_ADDON_EXPECT_SOURCE_TREE_STATE: clean
          NR_ADDON_RELEASE_AUTHORITY_MODE: production
          NR_CMS_RELEASE_SHA: ${{ env.CMS_SHA }}
          NR_LICENSE_SERVER_RELEASE_SHA: ${{ env.SOURCE_SHA }}
          NR_WEBSHOP_RELEASE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CMS_SHA"
          test "$(git -C ".private/$PACKAGE_PATH" rev-parse HEAD)" = "$SOURCE_SHA"
          release_timestamp="$(git -C ".private/$PACKAGE_PATH" show -s --format=%cI "$SOURCE_SHA")"
          NR_ADDON_RELEASED_AT="$(node -e 'process.stdout.write(new Date(process.argv[1]).toISOString())' "$release_timestamp")"
          export NR_ADDON_RELEASED_AT
          npm ci --ignore-scripts --audit=false --fund=false
          npm --prefix ".private/$PACKAGE_PATH" ci --ignore-scripts --audit=false --fund=false
          NR_ADDON_SOURCE_MODE=empty npm run addons:registry
          npm --prefix ".private/$PACKAGE_PATH" run build
          npm --prefix ".private/$PACKAGE_PATH" run pack:verify
          actual_artifact="$(node -e "process.stdout.write(require('./.private/'+process.env.PACKAGE_PATH+'/provenance.json').subject.artifactSha256)")"
          actual_migrations="$(sha256sum ".private/$PACKAGE_PATH/migrations.json" | awk '{print $1}')"
          echo "::notice title=Canonical artifact SHA-256::$actual_artifact"
          echo "::notice title=Migration bundle SHA-256::$actual_migrations"
          if test '${{ inputs.mode }}' != 'verify'; then
            test "$actual_artifact" = "$EXPECTED_ARTIFACT_SHA256"
            test "$actual_migrations" = "$EXPECTED_MIGRATION_SHA256"
          fi
          mkdir -p "$RUNNER_TEMP/release-output"
          pushd ".private/$PACKAGE_PATH" >/dev/null
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-output"
          popd >/dev/null
          tarball="$RUNNER_TEMP/release-output/$TARBALL_FILE"
          test -f "$tarball"
          tarball_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          tarball_integrity="$(node -e "const fs=require('fs'),c=require('crypto');process.stdout.write('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$tarball")"
          {
            echo "TARBALL=$tarball"
            echo "TARBALL_SHA256=$tarball_sha256"
            echo "TARBALL_INTEGRITY=$tarball_integrity"
          } >> "$GITHUB_ENV"

      - name: Verify create-only registry and release state
        if: inputs.mode != 'verify'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NR_PACKAGE_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.NR_PACKAGE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/npm-view-error.txt"
          if registry_integrity="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity --json 2>"$error_file")"; then
            registry_integrity="$(node -e "process.stdout.write(JSON.parse(process.argv[1]))" "$registry_integrity")"
            test '${{ inputs.mode }}' = 'reconcile'
            test "$registry_integrity" = "$TARBALL_INTEGRITY"
          else
            grep -Eq 'E404|404 Not Found' "$error_file"
            test '${{ inputs.mode }}' = 'publish'
          fi
          if gh release view "v$PACKAGE_VERSION" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            test '${{ inputs.mode }}' = 'reconcile'
          fi

      - name: Publish exact tarball or reconcile registry state
        if: inputs.mode != 'verify'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NR_PACKAGE_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.NR_PACKAGE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if test '${{ inputs.mode }}' = 'publish'; then
            npm publish "$TARBALL" --access restricted --registry https://npm.pkg.github.com
          fi
          registry_integrity="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity --json)"
          registry_integrity="$(node -e "process.stdout.write(JSON.parse(process.argv[1]))" "$registry_integrity")"
          test "$registry_integrity" = "$TARBALL_INTEGRITY"
          version_row=''
          for _ in {1..12}; do
            version_row="$(gh api --paginate "users/radomirradojevic/packages/npm/$PACKAGE_SLUG/versions?per_page=100" --jq ".[] | select(.name == \"$PACKAGE_VERSION\") | [.id,.created_at] | @tsv" | head -n 1 || true)"
            test -n "$version_row" && break
            sleep 5
          done
          test -n "$version_row"
          registry_id="${version_row%%$'\t'*}"
          published_at="${version_row#*$'\t'}"
          [[ "$registry_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$published_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          echo "REGISTRY_VERSION_ID=$registry_id" >> "$GITHUB_ENV"
          echo "PUBLISHED_AT=$published_at" >> "$GITHUB_ENV"

      - name: Create signed publication evidence and draft GitHub release
        if: inputs.mode != 'verify'
        shell: bash
        working-directory: release-root/.private/${{ env.PACKAGE_PATH }}
        env:
          GH_TOKEN: ${{ secrets.NR_PACKAGE_RELEASE_TOKEN }}
          NR_ADDON_RELEASE_AUTHORITY_MODE: production
        run: |
          set -euo pipefail
          attestation="$RUNNER_TEMP/release-output/release-publication-attestation.json"
          node scripts/build-release-publication-attestation.mjs \
            --tarball "$TARBALL" \
            --output "$attestation" \
            --published-at "$PUBLISHED_AT" \
            --registry-package-version-id "$REGISTRY_VERSION_ID"
          attestation_sha="$(sha256sum "$attestation" | awk '{print $1}')"
          receipt="$RUNNER_TEMP/release-output/release-publish-receipt.json"
          node -e "const fs=require('fs');fs.writeFileSync(process.argv[1],JSON.stringify({artifactSha256:process.env.EXPECTED_ARTIFACT_SHA256,attestationSha256:process.argv[2],cmsSha:process.env.CMS_SHA,contractVersion:1,migrationBundleSha256:process.env.EXPECTED_MIGRATION_SHA256,packageName:process.env.PACKAGE_NAME,packageVersion:process.env.PACKAGE_VERSION,registryPackageVersionId:process.env.REGISTRY_VERSION_ID,sourceSha:process.env.SOURCE_SHA,tarballIntegrity:process.env.TARBALL_INTEGRITY,tarballSha256:process.env.TARBALL_SHA256})+'\n',{encoding:'utf8',flag:'wx',mode:0o600})" "$receipt" "$attestation_sha"
          tag="v$PACKAGE_VERSION"
          if ! gh release view "$tag" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$TARGET_REPOSITORY" --target "$SOURCE_SHA" --draft --title "$RELEASE_TITLE" --notes "Immutable production package publication evidence."
          fi
          asset_names="$(gh release view "$tag" --repo "$TARGET_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in release-publication-attestation.json addon-release-public-keys.json release-publish-receipt.json; do
            if grep -Fxq "$asset" <<<"$asset_names"; then
              test '${{ inputs.mode }}' = 'reconcile'
            else
              case "$asset" in
                release-publication-attestation.json) source="$attestation" ;;
                addon-release-public-keys.json) source="$NR_ADDON_RELEASE_PUBLIC_KEYS_FILE" ;;
                release-publish-receipt.json) source="$receipt" ;;
              esac
              gh release upload "$tag" "$source#$asset" --repo "$TARGET_REPOSITORY"
            fi
          done

      - name: Export secret-free immutable publication evidence
        if: inputs.mode != 'verify'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.addon }}-production-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-output/release-publication-attestation.json
            ${{ runner.temp }}/release-output/release-publish-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral authority and registry files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/addon-release-signing-key.pem"
          rm -f "$RUNNER_TEMP/addon-release-public-keys.json"
          rm -f "$RUNNER_TEMP/npm-view-error.txt"
