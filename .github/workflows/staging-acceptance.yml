name: Staging Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-raven-staging-acceptance
  cancel-in-progress: false

jobs:
  run-staging-acceptance:
    name: GitHub-hosted staging E2E and recovery drills
    runs-on: ubuntu-24.04
    environment: staging-acceptance
    timeout-minutes: 90
    env:
      NR_ACCEPTANCE_TARGET: staging
      NR_ADDON_RELEASE_SIGNING_KID: ${{ vars.NR_ADDON_RELEASE_SIGNING_KID }}
      NR_ACCEPTANCE_SCENARIO_RUNNER_SHA256: ${{ vars.NR_ACCEPTANCE_SCENARIO_RUNNER_SHA256 }}
      # Keep the strict non-local release contract fail-closed while trusting
      # only this protected environment's staging-only signing KID.
      NR_ADDON_RELEASE_PRODUCTION_KIDS: ${{ vars.NR_ADDON_RELEASE_SIGNING_KID }}
      NR_STAGING_WORKSPACE_ROOT: ${{ github.workspace }}
      NR_WEBSHOP_GIT_SHA: 2fa623a0912f72b15025712d8e2ca906946ed19e
      NR_LICENSE_SERVER_ADDON_GIT_SHA: 6bdb1c8c06a062bd98313af941d774fa535b1f99
      NR_MASTER_GIT_SHA: 8fa03719a6040613ab6c796a31b2b87ff5640dcf
      NR_DEPLOYMENT_WORKER_GIT_SHA: 9c7ffef59812aa5153f61f2f62b02ece0fdc1e9c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Webshop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/webshop
          ref: ${{ env.NR_WEBSHOP_GIT_SHA }}
          ssh-key: ${{ secrets.NR_WEBSHOP_DEPLOY_KEY }}
          path: .private/webshop
          persist-credentials: false

      - name: Checkout pinned License Server add-on source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/license-server-addon
          ref: ${{ env.NR_LICENSE_SERVER_ADDON_GIT_SHA }}
          ssh-key: ${{ secrets.NR_LICENSE_SERVER_ADDON_DEPLOY_KEY }}
          path: .private/license-server-addon
          persist-credentials: false

      - name: Checkout pinned central Master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/license-server
          ref: ${{ env.NR_MASTER_GIT_SHA }}
          ssh-key: ${{ secrets.NR_MASTER_DEPLOY_KEY }}
          path: .private/license-server
          persist-credentials: false

      - name: Checkout pinned deployment worker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/addon-deployment-worker
          ref: ${{ env.NR_DEPLOYMENT_WORKER_GIT_SHA }}
          ssh-key: ${{ secrets.NR_DEPLOYMENT_WORKER_DEPLOY_KEY }}
          path: .private/addon-deployment-worker
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Materialize ephemeral staging inputs
        shell: bash
        env:
          NR_ACCEPTANCE_CONFIG_B64: ${{ secrets.NR_ACCEPTANCE_CONFIG_B64 }}
          NR_ACCEPTANCE_SCENARIO_RUNNER_B64: ${{ secrets.NR_ACCEPTANCE_SCENARIO_RUNNER_B64 }}
          NR_ADDON_RELEASE_PUBLIC_KEYS_B64: ${{ secrets.NR_ADDON_RELEASE_PUBLIC_KEYS_B64 }}
          NR_ADDON_RELEASE_SIGNING_KEY_B64: ${{ secrets.NR_ADDON_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${NR_ACCEPTANCE_CONFIG_B64:-}"
          test -n "${NR_ACCEPTANCE_SCENARIO_RUNNER_B64:-}"
          [[ "${NR_ACCEPTANCE_SCENARIO_RUNNER_SHA256:-}" =~ ^[a-f0-9]{64}$ ]]
          test -n "${NR_ADDON_RELEASE_PUBLIC_KEYS_B64:-}"
          test -n "${NR_ADDON_RELEASE_SIGNING_KEY_B64:-}"
          umask 077
          printf '%s' "$NR_ACCEPTANCE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/night-raven-acceptance.staging.json"
          printf '%s' "$NR_ACCEPTANCE_SCENARIO_RUNNER_B64" | base64 --decode > "$RUNNER_TEMP/night-raven-staging-scenario-runner"
          printf '%s  %s\n' "$NR_ACCEPTANCE_SCENARIO_RUNNER_SHA256" "$RUNNER_TEMP/night-raven-staging-scenario-runner" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/night-raven-staging-scenario-runner"
          printf '%s' "$NR_ADDON_RELEASE_PUBLIC_KEYS_B64" | base64 --decode > "$RUNNER_TEMP/addon-release-public-keys.json"
          printf '%s' "$NR_ADDON_RELEASE_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/addon-release-signing-key.pem"
          mkdir -p "$RUNNER_TEMP/night-raven-staging-evidence"
          {
            echo "NR_ACCEPTANCE_CONFIG_PATH=$RUNNER_TEMP/night-raven-acceptance.staging.json"
            echo "NR_ACCEPTANCE_SCENARIO_RUNNER_PATH=$RUNNER_TEMP/night-raven-staging-scenario-runner"
            echo "NR_ADDON_RELEASE_PUBLIC_KEYS_FILE=$RUNNER_TEMP/addon-release-public-keys.json"
            echo "NR_ADDON_RELEASE_SIGNING_KEY_FILE=$RUNNER_TEMP/addon-release-signing-key.pem"
            echo "NR_STAGING_EVIDENCE_DIRECTORY=$RUNNER_TEMP/night-raven-staging-evidence"
          } >> "$GITHUB_ENV"

      - name: Verify isolated GitHub-hosted staging configuration
        shell: bash
        env:
          NR_ACCEPTANCE_OPERATOR_IDENTITY: ${{ secrets.NR_ACCEPTANCE_OPERATOR_IDENTITY }}
          NR_ACCEPTANCE_PROVIDER_IDENTITY: ${{ secrets.NR_ACCEPTANCE_PROVIDER_IDENTITY }}
          NR_ACCEPTANCE_STAGING_IDENTITY: ${{ secrets.NR_ACCEPTANCE_STAGING_IDENTITY }}
        run: |
          set -euo pipefail
          for name in NR_STAGING_WORKSPACE_ROOT NR_ACCEPTANCE_CONFIG_PATH NR_ACCEPTANCE_SCENARIO_RUNNER_PATH NR_ACCEPTANCE_SCENARIO_RUNNER_SHA256 NR_STAGING_EVIDENCE_DIRECTORY NR_ACCEPTANCE_OPERATOR_IDENTITY NR_ACCEPTANCE_PROVIDER_IDENTITY NR_ACCEPTANCE_STAGING_IDENTITY NR_ADDON_RELEASE_SIGNING_KEY_FILE NR_ADDON_RELEASE_SIGNING_KID NR_ADDON_RELEASE_PRODUCTION_KIDS NR_ADDON_RELEASE_PUBLIC_KEYS_FILE; do
            test -n "${!name:-}" || { echo "$name is not configured"; exit 1; }
          done
          test "$NR_ADDON_RELEASE_PRODUCTION_KIDS" = "$NR_ADDON_RELEASE_SIGNING_KID"
          test -d "$NR_STAGING_WORKSPACE_ROOT/.private"
          test -r "$NR_ACCEPTANCE_CONFIG_PATH"
          test -x "$NR_ACCEPTANCE_SCENARIO_RUNNER_PATH"
          test -r "$NR_ADDON_RELEASE_SIGNING_KEY_FILE"
          test -r "$NR_ADDON_RELEASE_PUBLIC_KEYS_FILE"
          test "$(git -C "$NR_STAGING_WORKSPACE_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$NR_STAGING_WORKSPACE_ROOT/.private/webshop" rev-parse HEAD)" = "$NR_WEBSHOP_GIT_SHA"
          test "$(git -C "$NR_STAGING_WORKSPACE_ROOT/.private/license-server-addon" rev-parse HEAD)" = "$NR_LICENSE_SERVER_ADDON_GIT_SHA"
          test "$(git -C "$NR_STAGING_WORKSPACE_ROOT/.private/license-server" rev-parse HEAD)" = "$NR_MASTER_GIT_SHA"
          test "$(git -C "$NR_STAGING_WORKSPACE_ROOT/.private/addon-deployment-worker" rev-parse HEAD)" = "$NR_DEPLOYMENT_WORKER_GIT_SHA"

      - name: Install pinned acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$NR_STAGING_WORKSPACE_ROOT"
          npm ci --ignore-scripts

      - name: Run read-only staging acceptance preflight
        shell: bash
        env:
          NR_ACCEPTANCE_OPERATOR_IDENTITY: ${{ secrets.NR_ACCEPTANCE_OPERATOR_IDENTITY }}
          NR_ACCEPTANCE_PROVIDER_IDENTITY: ${{ secrets.NR_ACCEPTANCE_PROVIDER_IDENTITY }}
          NR_ACCEPTANCE_STAGING_IDENTITY: ${{ secrets.NR_ACCEPTANCE_STAGING_IDENTITY }}
        run: |
          set -euo pipefail
          cd "$NR_STAGING_WORKSPACE_ROOT"
          npm run acceptance:preflight

      - name: Run strict versioned staging acceptance
        shell: bash
        env:
          NR_ACCEPTANCE_OPERATOR_IDENTITY: ${{ secrets.NR_ACCEPTANCE_OPERATOR_IDENTITY }}
          NR_ACCEPTANCE_PROVIDER_IDENTITY: ${{ secrets.NR_ACCEPTANCE_PROVIDER_IDENTITY }}
          NR_ACCEPTANCE_STAGING_IDENTITY: ${{ secrets.NR_ACCEPTANCE_STAGING_IDENTITY }}
        run: |
          set -euo pipefail
          cd "$NR_STAGING_WORKSPACE_ROOT"
          npm run acceptance

      - name: Archive redacted staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: night-raven-staging-acceptance-${{ github.run_id }}
          path: ${{ env.NR_STAGING_EVIDENCE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral staging inputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/night-raven-acceptance.staging.json"
          rm -f "$RUNNER_TEMP/night-raven-staging-scenario-runner"
          rm -f "$RUNNER_TEMP/addon-release-public-keys.json"
          rm -f "$RUNNER_TEMP/addon-release-signing-key.pem"
