name: Private Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-raven-private-release
  cancel-in-progress: false

jobs:
  verify-private-release:
    name: Private package provenance and clean-host gate
    runs-on: ubuntu-24.04
    environment: private-release
    timeout-minutes: 45
    env:
      NR_ADDON_RELEASE_SIGNING_KID: ${{ vars.NR_ADDON_RELEASE_SIGNING_KID }}
      # The strict release contract calls its explicit non-local KID allowlist
      # "production". This protected environment supplies only its staging KID;
      # the resulting verification artifact has no production publish authority.
      NR_ADDON_RELEASE_PRODUCTION_KIDS: ${{ vars.NR_ADDON_RELEASE_SIGNING_KID }}
      NR_PRIVATE_WORKSPACE_ROOT: ${{ github.workspace }}
      NR_WEBSHOP_GIT_SHA: 03e3861b296a0ea4b4f993830a1deee6c7b82909
      NR_LICENSE_SERVER_ADDON_GIT_SHA: 05bab07bd6f2935dd786e8abc244196faef4882e
      NR_MASTER_GIT_SHA: 8fa03719a6040613ab6c796a31b2b87ff5640dcf
      NR_DEPLOYMENT_WORKER_GIT_SHA: 34821346bda3799ef4cfcc7e49d73b31fe1813f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Webshop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/webshop
          ref: ${{ env.NR_WEBSHOP_GIT_SHA }}
          ssh-key: ${{ secrets.NR_WEBSHOP_DEPLOY_KEY }}
          path: .private/webshop
          persist-credentials: false

      - name: Checkout pinned License Server add-on source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/license-server-addon
          ref: ${{ env.NR_LICENSE_SERVER_ADDON_GIT_SHA }}
          ssh-key: ${{ secrets.NR_LICENSE_SERVER_ADDON_DEPLOY_KEY }}
          path: .private/license-server-addon
          persist-credentials: false

      - name: Checkout pinned central Master source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/license-server
          ref: ${{ env.NR_MASTER_GIT_SHA }}
          ssh-key: ${{ secrets.NR_MASTER_DEPLOY_KEY }}
          path: .private/license-server
          persist-credentials: false

      - name: Checkout pinned deployment worker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radomirradojevic/addon-deployment-worker
          ref: ${{ env.NR_DEPLOYMENT_WORKER_GIT_SHA }}
          ssh-key: ${{ secrets.NR_DEPLOYMENT_WORKER_DEPLOY_KEY }}
          path: .private/addon-deployment-worker
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Materialize ephemeral release authority files
        shell: bash
        env:
          NR_ADDON_RELEASE_PUBLIC_KEYS_B64: ${{ secrets.NR_ADDON_RELEASE_PUBLIC_KEYS_B64 }}
          NR_ADDON_RELEASE_SIGNING_KEY_B64: ${{ secrets.NR_ADDON_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${NR_ADDON_RELEASE_PUBLIC_KEYS_B64:-}"
          test -n "${NR_ADDON_RELEASE_SIGNING_KEY_B64:-}"
          umask 077
          printf '%s' "$NR_ADDON_RELEASE_PUBLIC_KEYS_B64" | base64 --decode > "$RUNNER_TEMP/addon-release-public-keys.json"
          printf '%s' "$NR_ADDON_RELEASE_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/addon-release-signing-key.pem"
          echo "NR_ADDON_RELEASE_PUBLIC_KEYS_FILE=$RUNNER_TEMP/addon-release-public-keys.json" >> "$GITHUB_ENV"
          echo "NR_ADDON_RELEASE_SIGNING_KEY_FILE=$RUNNER_TEMP/addon-release-signing-key.pem" >> "$GITHUB_ENV"

      - name: Verify GitHub-hosted private workspace and signing references
        shell: bash
        run: |
          set -euo pipefail
          for name in NR_PRIVATE_WORKSPACE_ROOT NR_ADDON_RELEASE_SIGNING_KEY_FILE NR_ADDON_RELEASE_SIGNING_KID NR_ADDON_RELEASE_PRODUCTION_KIDS NR_ADDON_RELEASE_PUBLIC_KEYS_FILE; do
            test -n "${!name:-}" || { echo "$name is not configured"; exit 1; }
          done
          test "$NR_ADDON_RELEASE_PRODUCTION_KIDS" = "$NR_ADDON_RELEASE_SIGNING_KID"
          test -d "$NR_PRIVATE_WORKSPACE_ROOT/.private"
          test -r "$NR_ADDON_RELEASE_SIGNING_KEY_FILE"
          test -r "$NR_ADDON_RELEASE_PUBLIC_KEYS_FILE"
          test "$(git -C "$NR_PRIVATE_WORKSPACE_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$NR_PRIVATE_WORKSPACE_ROOT/.private/webshop" rev-parse HEAD)" = "$NR_WEBSHOP_GIT_SHA"
          test "$(git -C "$NR_PRIVATE_WORKSPACE_ROOT/.private/license-server-addon" rev-parse HEAD)" = "$NR_LICENSE_SERVER_ADDON_GIT_SHA"
          test "$(git -C "$NR_PRIVATE_WORKSPACE_ROOT/.private/license-server" rev-parse HEAD)" = "$NR_MASTER_GIT_SHA"
          test "$(git -C "$NR_PRIVATE_WORKSPACE_ROOT/.private/addon-deployment-worker" rev-parse HEAD)" = "$NR_DEPLOYMENT_WORKER_GIT_SHA"

      - name: Verify signed private packages without revealing key material
        shell: bash
        run: |
          set -euo pipefail
          cd "$NR_PRIVATE_WORKSPACE_ROOT"
          npm ci --ignore-scripts
          NR_ADDON_SOURCE_MODE=empty npm run addons:registry
          npm run acceptance:private-packages

      - name: Remove ephemeral release authority files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/addon-release-public-keys.json"
          rm -f "$RUNNER_TEMP/addon-release-signing-key.pem"
